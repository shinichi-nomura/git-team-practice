<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <header class="site-header">s
        <nav aria-label="メインナビゲーション">
            <a href="../index.html">Top</a>
            <a href="about.html">About</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>
    <main class="contact">
        <h1>お問合せ</h1>
        <p class="intro">商品やサービスについてのご質問は、下記フォームよりお寄せください。</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">お名前<span>必須</span></label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス<span>必須</span></label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="message">お問い合わせ内容<span>必須</span></label>
                <textarea id="message" name="message" rows="5" cols="36" required></textarea>
            </div>

            <button type="submit">送信</button>
        </form>
    </main>

</body>

</html>
